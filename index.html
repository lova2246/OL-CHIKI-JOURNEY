<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#183b2a">
  <meta name="description" content="OL CHIKI JOURNEY — Learn • Play • Explore">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="image/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>OL CHIKI JOURNEY</title>
</head>
<body>
  <div id="app">
    <section id="splash" class="screen splash-screen">
      <img src="image/official-logo.png" class="splash-logo" alt="OL CHIKI JOURNEY official logo">
      <p class="tagline">Learn • Play • Explore</p>
      <button id="splashStart" class="primary">Start Journey</button>
      <small>Created by LOVA HANSDA</small>
    </section>

    <section id="languageScreen" class="screen hidden">
      <div class="center-card">
        <img src="image/official-logo.png" class="mini-logo" alt="">
        <h1 data-i18n="chooseLanguage">Choose Language</h1>
        <p data-i18n="languageHelp">Choose your interface language. Learning content stays in Santhali / Ol Chiki.</p>
        <div class="language-grid">
          <button data-lang="en">English</button>
          <button data-lang="ne">नेपाली</button>
          <button data-lang="hi">हिन्दी</button>
          <button data-lang="bn">বাংলা</button>
        </div>
      </div>
    </section>

    <section id="accountScreen" class="screen hidden">
      <div class="center-card narrow">
        <h1 data-i18n="welcome">Welcome</h1>
        <p data-i18n="accountHelp">Create a learner profile or continue as a guest.</p>
        <input id="nameInput" maxlength="40" placeholder="Your name">
        <div class="row">
          <button id="createProfile" class="primary" data-i18n="createAccount">Create Account</button>
          <button id="guestProfile" data-i18n="guest">Continue as Guest</button>
        </div>
        <button id="existingProfile" class="text-button" data-i18n="existing">Use saved profile</button>
      </div>
    </section>

    <div id="shell" class="hidden">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
        <div class="brand">
          <img src="image/icon-192.png" alt="">
          <div>
            <strong>OL CHIKI JOURNEY</strong>
            <small>Learn • Play • Explore</small>
          </div>
        </div>
        <button id="langBtn" class="lang-btn">EN</button>
      </header>

      <main id="view"></main>

      <nav class="bottom-nav" aria-label="Main navigation">
        <button data-route="home"><span>⌂</span><small data-i18n="home">Home</small></button>
        <button data-route="journey"><span>🗺</span><small data-i18n="journey">Journey</small></button>
        <button data-route="practice"><span>✍</span><small data-i18n="practice">Practice</small></button>
        <button data-route="profile"><span>●</span><small data-i18n="profile">Profile</small></button>
      </nav>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-card">
        <button id="modalClose" class="close">×</button>
        <div id="modalBody"></div>
      </div>
    </div>
  </div>

  <script src="data/letters.js"></script>
  <script src="data/numbers.js"></script>
  <script src="app.js"></script>
</body>
</html>
